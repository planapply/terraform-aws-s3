version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: terraform
    directories:
      - /
      - /examples/basic
      - /examples/complete
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
