formatter: markdown table

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    <details>
    <summary>Requirements, resources, inputs, and outputs (generated by terraform-docs)</summary>

    {{ .Content }}

    </details>
    <!-- END_TF_DOCS -->

sections:
  show:
    - requirements
    - resources
    - inputs
    - outputs

sort:
  enabled: true
  by: name

settings:
  anchor: false
  default: true
  description: true
  escape: false
  hide-empty: true
  html: false
  indent: 3
  lockfile: false
  required: false
  type: true
